excludes:
  scopes:
  - pattern: "devDependencies"
    reason: "DEV_DEPENDENCY_OF"
    comment: "Packages for development only."
  paths:
  - pattern: ".reuse/dep5"
    reason: "OTHER"
    comment: "This file declares license information for the REUSE tool."
  - pattern: "LICENSES/*"
    reason: "OTHER"
    comment: "This directory contains license files for the REUSE tool."
  - pattern: "apps/clearance_ui/.next/**"
    reason: "BUILD_TOOL_OF"
    comment: "This directory is produced by npm build on NextJS projects."
  - pattern: "apps/clearance_ui/tests/**"
    reason: "TEST_OF"
    comment: "This directory only contains tests."
  - pattern: "apps/clearance_ui/src/testData/**"
    reason: "TEST_OF"
    comment: "This directory only contains test data for matchers."
  - pattern: "packages/database/src/test_data/**"
    reason: "TEST_OF"
    comment: "This directory only contains test data for the database."
  - pattern: "packages/spdx-validation/tests/**"
    reason: "TEST_OF"
    comment: "This directory contains tests for SPDX validation."

resolutions:
  issues:
  - message: "invalid: @typescript-eslint/eslint-plugin@.*"
    reason: "BUILD_TOOL_ISSUE"
    comment: "npm ls, run by ORT's NPM analyzer after installing the workspace, reports
      @typescript-eslint/eslint-plugin as invalid. The hoisted plugin is at 8.x, while
      eslint-plugin-jest 27.x (pulled in by @vercel/style-guide 6.x via
      eslint-config-custom) declares a peer dependency range of ^5.0.0 || ^6.0.0 ||
      ^7.0.0 on it. The peer range mismatch is a lint-time concern only: the package is
      a dev-only linting tool, already excluded at scope level via the devDependencies
      scope exclude, so this has no effect on production dependency analysis."
  - message: "@img/sharp-wasm32@.*"
    reason: "BUILD_TOOL_ISSUE"
    comment: "npm ls reports @img/sharp-wasm32 and its nested @emnapi/runtime as
      extraneous. It is a platform-specific WebAssembly build of sharp, depended on
      only by @img/sharp-freebsd-wasm32 and @img/sharp-webcontainers-wasm32, which npm
      skips on ORT's linux-x64 analyzer host; the lock file still installs it, leaving
      it without a dependant. sharp itself is an optional dependency of next, used for
      image optimization; the extraneous wasm32 binary is not used on this platform
      and does not affect dependency analysis."

license_choices:
  repository_license_choices:
  - given: CC0-1.0 OR MIT
    choice: MIT
  - given: GPL-2.0-only OR MIT
    choice: MIT
  - given: MIT OR BSD-3-Clause OR GPL-2.0-only
    choice: MIT

curations:
  license_findings:
  - path: "README.md"
    detected_license: "MIT AND LicenseRef-scancode-free-unknown"
    reason: "INCORRECT"
    comment: "Incorrect scanner match."
    concluded_license: "MIT"
  - path: "packages/spdx-validation/README.md"
    detected_license: "MIT AND (MIT AND JSON) AND (BSD-2-Clause AND GPL-2.0-only WITH GCC-exception-2.0 AND GPL-2.0-only WITH GCC-exception-2.0 AND CC-BY-3.0 AND MIT)"
    reason: "INCORRECT"
    comment: "Incorrect scanner matches coming from SPDX license parsing examples in README."
    concluded_license: "MIT"